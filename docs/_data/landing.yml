      - q: "Ücretsiz mi?"
        a: "Evet. RobotWin Studio MIT lisansıyla açık kaynaktır; kaynak kodu GitHub'dadır."
      - q: "Windows kurulum dosyası için uyarı veriyor."
        a: "Dosyayı projenin GitHub Sürümler sayfasından indirdiğinizden emin olun, sonra <b>Ek bilgi → Yine de çalıştır</b> seçin."
      - q: "Uygulama açılmıyor veya .NET istiyor."
        a: "RobotWin Studio .NET 9 Masaüstü Çalışma Zamanı'na ihtiyaç duyar. Kurulum dosyasını yeniden çalıştırıp .NET önerisini kabul edin ya da .NET'i içinde taşıyan tam paketi (<code>-tam.exe</code>) kullanın."
      - q: "Uygulamayı USB bellekten çalıştırabilir miyim?"
        a: "Evet. Kurulum dosyasını komut satırından <code>/S /PORTABLE /D=E:\\RobotWin</code> ile çalıştırın; yalnızca dosyalar açılır, kısayol ve kayıt defteri girdisi oluşturulmaz."
      - q: "Kendi kodumu derlemek için ne gerekir?"
        a: "Hazır örnekler derlenmiş gelir. Arduino Uno / Nano için <code>arduino-cli</code>, ESP32 için Visual Studio C++ araçları gerekir; uygulama onları kendisi bulur."
      - q: "Hangi diller var?"
        a: "Uygulama İngilizce varsayılan, Türkçe seçilebilir arayüze geçiyor. Adım adım kullanım kılavuzu Türkçe, geliştirici belgeleri İngilizcedir."
