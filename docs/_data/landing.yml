# Text of the landing pages: index.html (en, default) and tr/index.html (tr).
# Values may contain inline HTML; they are written into the page as is.
# Comparison values: yes / part / no.

en:
  hero:
    eyebrow: "Free and open source · Windows"
    title: "Design, code and run robots <span class=\"nowrap\">with real physics.</span>"
    pitch: "RobotWin Studio puts circuit simulation, PCB layout, Arduino and ESP32 firmware, 3D modelling and an open physics world into one Windows app — and runs them all together."
    note: "Windows 10 / 11 · 64-bit · MIT license"
    image_alt: "RobotWin Studio World page: a car driven by an ESP32 and a PS5 controller"
    guide: "User guide"
    github: "GitHub"
    demo_label: "RobotWin Studio in action"
  download:
    label: "Download for Windows"
    loading: "Looking up the latest release…"
    full: ".NET included"
    fallback: "Releases page"
    small: "Small package (needs .NET 9)"
    version: "Version"
  stats:
    - value: "256"
      label: "real parts in the library"
    - value: "6"
      label: "stages, schematic to world"
    - value: "AVR + ESP32"
      label: "firmware runs in emulation"
    - value: "2 · 4 · 6"
      label: "layer PCBs, Gerber and KiCad"
    - value: "1"
      label: "simulation: circuit, code and physics in lock-step"
  line:
    kicker: "The design-to-real line"
    title: "One project, every stage."
    text: "The rail on the left of the app walks a project from schematic to a running machine. Each stage builds on the one before; at the end, boards, parts, cables and mechanics run together in the same world."
  guide_link: "Read the guide"
  stages:
    devre:
      short: "Schematic capture with live analog simulation, instruments and fault diagnosis."
      title: "Draw the schematic, simulate it live"
      text: "Pick from 256 real parts. The analog solver computes voltages, currents, heating and component damage; press buttons, turn potentiometers and probe wires while it runs."
      bullets:
        - "Oscilloscope, multimeter and bench power supply"
        - "Monte Carlo tolerance runs and fault diagnosis: “why did it burn?”"
        - "ERC; BOM, KiCad and SPICE netlists, PNG / SVG export"
      image_alt: "Circuit page: line-follower schematic and oscilloscope"
    pcb:
      short: "Multi-layer boards, interactive routing, DRC and manufacturing files."
      title: "KiCad-level board design"
      text: "Parts come over from the schematic. Place them, route interactively or automatically, pour copper zones, check the rules and export files ready for the fab."
      bullets:
        - "2, 4 or 6 copper layers; blind / buried vias, net classes"
        - "Walk-around router, auto-placement and auto-routing, DRC"
        - "Gerber X2 + Excellon + BOM + CPL in one ZIP; KiCad 8 project export"
      image_alt: "PCB page: layers, tracks and copper zones"
    kod:
      short: "Arduino and ESP32 code, built and running on emulated boards."
      title: "Your firmware runs in emulation"
      text: "Write the code, build it (F7), load it onto the emulated board and run it (F5). Arduino firmware runs as real compiled HEX on an ATmega328P emulator; ESP32 sketches run in lock-step with the circuit."
      bullets:
        - "Timers and PWM, USART, ADC, EEPROM, watchdog, I²C"
        - "ESP32: GPIO, LEDC, FreeRTOS, Wire, Servo, simulated Wi-Fi, BLE, Bluepad32"
        - "Readable compiler errors, serial monitor, ready-made templates"
      serial: "Serial monitor"
      board: "Arduino Uno"
      sketch: "Blink (D13 LED)"
      build: "Build"
      run: "Upload and run"
      comment: "on an emulated ATmega328P"
      led: "LED on"
    modelle:
      short: "A Blender-like modeller for chassis, brackets and enclosures."
      title: "A Blender-like 3D modeller"
      text: "Model the mechanical parts: chassis, brackets, enclosures, wheel hubs. Mass comes from material and infill; a finished part goes to the world with one key."
      bullets:
        - "Primitives, profile extrusion and revolve; edit mode"
        - "CSG union, difference, intersection; mirror and array"
        - "Ready robot parts; STL / OBJ / PLY import and export"
      image_alt: "Model page: the 3D modeller"
    montaj:
      short: "A rover or quadcopter assembled from your circuit, in a 3D arena."
      title: "A vehicle or drone, built from your circuit"
      text: "From the motors and sensors in your circuit, a robot car or quadcopter is assembled and driven in a 3D arena. Load and collisions feed back into the circuit."
      bullets:
        - "Line, IR obstacle and ultrasonic sensors are added automatically"
        - "Oval, figure-eight, obstacle and ramp arenas; four camera modes"
        - "Fault experiments: shorted battery, stalled shaft, broken propeller"
      table_head: ["In the circuit", "You get"]
      table:
        - ["Two motors", "Robot car"]
        - ["Flight controller + four motors", "X quadcopter"]
        - ["TCRT5000, IR, HC-SR04", "Sensors on the vehicle"]
    dunya:
      short: "Boards, parts, cables and mechanics in an open world with real physics."
      title: "An open world where everything runs together"
      text: "Put boards, parts, mechanical bodies and 3D models into a physics world; wire them, screw them, hinge them and run them. Circuit, firmware, radio and physics are computed together, step by step."
      bullets:
        - "Real cables: gauge, resistance, burn-out on overcurrent"
        - "Fixed, servo horn, motor shaft, hinge and slider joints"
        - "Sensors that see the scene: ultrasonic, line, cameras, LiDAR, IMU, GPS"
        - "Gamepads, IR remotes and a PC over USB; industrial arms and conveyors"
      image_alt: "World page: two-axis servo arm driven by an Arduino"
      gallery:
        - src: images/world-ps5-car.png
          caption: "ESP32 + PS5 controller car"
        - src: images/world-car.png
          caption: "Two-wheel car (real physics)"
        - src: images/world-sonar.png
          caption: "Ultrasonic sensor and obstacles"
  compare:
    kicker: "Why RobotWin Studio"
    title: "Electronics, firmware and physics in one simulation."
    text: "Typical tools cover one link of the chain, and you glue the rest together. RobotWin Studio runs the whole chain at once, so a motor stall shows up as a current spike on your scope."
    cols: ["Circuit simulator", "PCB editor", "Robot simulator", "RobotWin Studio"]
    rows:
      - ["Analog circuit simulation with instruments", "yes", "part", "no", "yes"]
      - ["PCB layout and manufacturing files", "part", "yes", "no", "yes"]
      - ["Arduino / ESP32 firmware in emulation", "part", "no", "part", "yes"]
      - ["3D modelling of mechanical parts", "no", "part", "part", "yes"]
      - ["Rigid-body physics world with sensors", "no", "no", "yes", "yes"]
      - ["All of it running together, step by step", "no", "no", "no", "yes"]
    legend:
      full: "Yes"
      partial: "Partly / some tools"
      none: "Not usually"
    note: "Compared with what typical tools in each category offer; individual products vary."
  instruments:
    kicker: "Instruments"
    title: "Instruments that behave like the real thing"
    text: "The scope probe loads the circuit, the multimeter fuse can blow, the bench supply goes into current limit."
    link: "Instruments chapter"
    items:
      - title: "Oscilloscope"
        text: "4 channels, triggering, cursors and automatic measurements."
      - title: "Multimeter"
        text: "6000 counts, true RMS, fused current inputs."
      - title: "Monte Carlo"
        text: "N runs with part tolerances and a histogram."
      - title: "Fault diagnosis"
        text: "Reversed LED, LED without resistor, short circuit, and why a part burned."
  requirements:
    kicker: "Download"
    title: "Get RobotWin Studio"
    rows:
      - ["Operating system", "Windows 10 or Windows 11, 64-bit (x64)"]
      - ["Runtime", ".NET 9 Desktop Runtime — included in the full package"]
      - ["Install", "Per user by default; no administrator rights needed"]
      - ["Your own Arduino code (optional)", "<code>arduino-cli</code> — <code>winget install ArduinoSA.CLI</code>"]
      - ["Your own ESP32 code (optional)", "Visual Studio C++ tools (MSVC)"]
    packages_title: "Which file should I download?"
    full_title: "Full package"
    full_text: "Carries .NET inside; nothing else to install. The easiest."
    small_title: "Small package"
    small_text: "Smaller download. Needs the .NET 9 Desktop Runtime; the wizard offers to install it if missing."
    file: "File"
  faq:
    kicker: "FAQ"
    title: "Frequently asked questions"
    more: "All questions (Turkish guide)"
    items:
      - q: "Is it free?"
        a: "Yes. RobotWin Studio is open source under the MIT license; the source code is on GitHub."
      - q: "Windows warns about the installer."
        a: "Make sure you downloaded it from the project's GitHub Releases page, then choose <b>More info → Run anyway</b>."
      - q: "The app does not start or asks for .NET."
        a: "RobotWin Studio needs the .NET 9 Desktop Runtime. Re-run the setup and accept its offer, or use the full package (<code>-tam.exe</code>) that carries .NET inside."
      - q: "Can I run it from a USB stick?"
        a: "Yes. Run the setup with <code>/S /PORTABLE /D=E:\\RobotWin</code>; it only unpacks the files, with no shortcuts or registry entries."
      - q: "What do I need to build my own firmware?"
        a: "The bundled examples ship precompiled. Arduino Uno / Nano needs <code>arduino-cli</code>; ESP32 needs the Visual Studio C++ tools. The app finds them itself."
      - q: "Which languages are available?"
        a: "The app is moving to English by default with Turkish selectable. The step-by-step user guide is currently in Turkish; the developer documentation is in English."
  news:
    kicker: "News"
    title: "Latest news and releases"
    more: "All news"
  closing:
    title: "Your first world in five minutes"
    text: "Install, open the <b>ESP32 + PS5 controller car</b> template from the Home page and press F5."

