<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
{% seo %}
{%- if page.alt_url %}
<link rel="alternate" hreflang="{{ lang }}" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="{% if lang == 'tr' %}en{% else %}tr{% endif %}" href="{{ page.alt_url | absolute_url }}">
{%- endif %}
<link rel="icon" href="{{ '/assets/img/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/robotwin-logo-32.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}">
<script>
  window.RW = {
    lang: {{ lang | jsonify }},
    searchUrl: {{ '/search.json' | relative_url | jsonify }},
    api: {{ site.repo_api | jsonify }},
    releases: {{ site.releases_url | jsonify }},
    t: {{ t | jsonify }}
  };
</script>
<script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}" defer></script>
