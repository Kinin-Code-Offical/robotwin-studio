<header class="top">
  <div class="top-inner">
    <button class="menu-btn" type="button" aria-label="{{ t.menu }}" aria-expanded="false" data-menu>
      <span></span><span></span><span></span>
    </button>
    <a class="brand" href="{{ home_url }}">
      <img src="{{ '/assets/img/robotwin-logo-64.png' | relative_url }}" alt="" width="24" height="24">
      <span>RobotWin Studio</span>
    </a>
    <nav class="top-nav" aria-label="{{ t.menu }}">
      <a href="{{ guide_url }}"{% if page.path contains 'kullanim/' %} aria-current="page"{% endif %}>{{ t.guide }}</a>
      <a href="{{ docs_url }}"{% if page.layout == 'default' and page.path contains 'kullanim/' %}{% elsif page.layout == 'default' %} aria-current="page"{% endif %}>{{ t.docs }}</a>
      <a href="{{ home_url }}#download">{{ t.download }}</a>
      <a href="{{ site.github_url }}">GitHub</a>
    </nav>
    <div class="top-tools">
      <div class="search">
        <input type="search" placeholder="{{ t.search_placeholder }}" aria-label="{{ t.search }}" data-search autocomplete="off">
        <ul class="search-results" data-results hidden></ul>
      </div>
      <a class="lang" href="{% if page.alt_url %}{{ page.alt_url | relative_url }}{% else %}{{ other_url }}{% endif %}" lang="{% if lang == 'tr' %}en{% else %}tr{% endif %}">{{ t.other_lang }}</a>
    </div>
  </div>
</header>
