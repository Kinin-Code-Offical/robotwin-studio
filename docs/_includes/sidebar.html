<nav class="side" aria-label="{{ t.docs }}" data-side>
  {%- for group in nav %}
  <p class="side-title">{{ group.title }}</p>
  <ul>
    {%- for item in group.items %}
    {%- capture item_url -%}{% include url.html path=item.path %}{%- endcapture %}
    <li><a href="{{ item_url }}"{% if item.path == page.path %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
    {%- endfor %}
  </ul>
  {%- endfor %}
</nav>
