name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Verify pinned SDK
        shell: pwsh
        run: |
          if (!(Test-Path ./global.json)) {
            Write-Error "global.json is missing. Please ensure the .NET SDK is pinned."
            exit 1
          }

      - name: Verify no tracked build artifacts
        shell: pwsh
        run: |
          $artifacts = git ls-files | Select-String -Pattern '(^|/)(bin|obj)/|TestResults/|^builds/'
          if ($artifacts) {
            Write-Error "Found tracked build artifacts. These must be gitignored:`n$artifacts"
            exit 1
          }

      - name: Restore
        run: dotnet restore RobotWinStudio.sln

      - name: Build
        run: dotnet build RobotWinStudio.sln -c Release --no-restore

      - name: Test
        run: dotnet test RobotWinStudio.sln -c Release --no-build --verbosity normal

      - name: Self-test (examples, simulation, PCB, DRC)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter RobotWinStudio.exe builds/RobotWin.Studio/Release | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--selftest","--selftest-out","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Performance check (every world template against tools/perf/baseline.json; a warning, never a failure)
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 30
        run: |
          $exe = Get-ChildItem -Recurse -Filter RobotWinStudio.exe builds/RobotWin.Studio/Release | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--perf-check","perf.txt","--perf-baseline","tools/perf/baseline.json","--perf-tolerance","60" -Wait -PassThru
          Get-Content perf.txt
          if ($p.ExitCode -ne 0) { Write-Output "::warning::Performance regression: see the report above"; exit 1 }

      - name: Render test (scene mirror, GPU renderer drawn and read back; WARP where there is no GPU)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter RobotWinStudio.exe builds/RobotWin.Studio/Release | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--render-test","render-test.txt" -Wait -PassThru
          Get-Content render-test.txt
          if ($p.ExitCode -ne 0) { exit 1 }
