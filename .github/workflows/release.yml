name: Release

# A pushed tag v* builds every release file, each on the system it is for, checks them and attaches them to the
# GitHub release with a SHA256SUMS.txt:
#   RobotWinStudio-Setup-<v>.exe               the Windows x64 installer, one for every kind of installation: full,
#                                              lite or custom; for this user, all users or portable; the language is
#                                              chosen in it. It downloads the components below from this release.
#   RobotWinStudio-<v>-app.rwpack              its components: the app,
#   RobotWinStudio-<v>-dotnet.rwpack             the app's own .NET 9 Desktop Runtime,
#   RobotWinStudio-<v>-arduino.rwpack            the Arduino compiler (arduino-cli + AVR core),
#   RobotWinStudio-<v>-occt.rwpack               STEP / IGES support (Open CASCADE)
#   RobotWinStudio-<v>-win-x64-portable.zip    the full app as a folder: unzip and run, nothing installed
#   RobotWin-Headless-<v>-win-x64.zip          headless simulator / automation server for Windows
#   RobotWin-Headless-<v>-linux-x64.tar.gz     headless simulator / automation server for Linux
#   RobotWinStudio-<v>-source.zip / .tar.gz    the source at the tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build the release files for (e.g. v1.3.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Installer, its components and the portable app
        shell: pwsh
        run: |
          $version = "$env:TAG".TrimStart('v')
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          # One setup and the components it downloads from this release; the script ends by installing them all from
          # its folder into a portable copy and checking every file.
          powershell -ExecutionPolicy Bypass -File ./tools/build-installer.ps1 -Version $version -Repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item builds/installer/release/* out/
          # The portable app is what the setup installs as a portable full copy (its components from the folder).
          $portable = "RobotWinStudio-$version-win-x64-portable"
          $p = Start-Process -FilePath "builds/installer/release/RobotWinStudio-Setup-$version.exe" -Wait -PassThru `
              -ArgumentList "/S", "/PORTABLE", "/TYPE=full", "`"/SOURCE=$PWD\builds\installer\release`"", "`"/D=$PWD\out\$portable`""
          if ($p.ExitCode -ne 0) { Get-Content "$env:TEMP\RobotWinStudio-Setup.log"; exit 1 }
          Compress-Archive -Path "out/$portable" -DestinationPath "out/$portable.zip"
          Remove-Item "out/$portable" -Recurse -Force

      - name: Portable app starts on its own .NET (self-test)
        shell: pwsh
        run: |
          Expand-Archive "out/RobotWinStudio-$env:VERSION-win-x64-portable.zip" -DestinationPath check
          $exe = Get-ChildItem check -Recurse -Filter RobotWinStudio.exe | Select-Object -First 1
          # The host's trace says where .NET came from: the copy's dotnet\ folder, not the runner's.
          $env:COREHOST_TRACE = "1"
          $env:COREHOST_TRACEFILE = "$PWD\host-trace.txt"
          $p = Start-Process $exe.FullName -ArgumentList '--selftest' -Wait -PassThru
          Remove-Item Env:COREHOST_TRACE, Env:COREHOST_TRACEFILE
          if ($p.ExitCode -ne 0) { throw "selftest failed with $($p.ExitCode)" }
          if (-not (Select-String -Path host-trace.txt -Pattern "Using app-relative location" -Quiet)) { throw "the portable app did not start on its own .NET" }

      - name: Headless simulator (Windows)
        shell: pwsh
        run: |
          $name = "RobotWin-Headless-$env:VERSION-win-x64"
          dotnet publish tools/RobotWin.Headless/RobotWin.Headless.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:VERSION -o "out/$name"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item tools/RobotWin.Headless/OKUBENI.txt "out/$name/"
          & "out/$name/RobotWin.Headless.exe" --run 1 --example car | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "headless run failed" }
          Compress-Archive -Path "out/$name" -DestinationPath "out/$name.zip"
          Remove-Item "out/$name" -Recurse -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Headless simulator (Linux)
        run: |
          version="${TAG#v}"
          name="RobotWin-Headless-$version-linux-x64"
          mkdir -p out
          dotnet publish tools/RobotWin.Headless/RobotWin.Headless.csproj -c Release -r linux-x64 --self-contained true -p:Version=$version -o "out/$name"
          cp tools/RobotWin.Headless/OKUBENI.txt "out/$name/"
          # It really runs on Linux: a 1 s batch run of the car example, JSON on stdout.
          "out/$name/RobotWin.Headless" --run 1 --example car > run.json
          grep -q '"sim_time"' run.json
          tar -C out -czf "out/$name.tar.gz" "$name"
          rm -rf "out/$name"

      - name: Source archives
        run: |
          version="${TAG#v}"
          git archive --format=zip --prefix="robotwin-studio-$version/" -o "out/RobotWinStudio-$version-source.zip" "$TAG"
          git archive --format=tar.gz --prefix="robotwin-studio-$version/" -o "out/RobotWinStudio-$version-source.tar.gz" "$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Checksums
        run: |
          cd files
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: files/*
          fail_on_unmatched_files: true
