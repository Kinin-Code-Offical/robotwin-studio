name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build the installer for (e.g. v2.0.0)"
        required: true

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Build installer
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart('v')
          powershell -ExecutionPolicy Bypass -File ./tools/build-installer.ps1 -Version $version
          powershell -ExecutionPolicy Bypass -File ./tools/build-installer.ps1 -Version $version -SelfContained
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            builds/installer/RobotWinStudio-Setup-${{ env.VERSION }}.exe
            builds/installer/RobotWinStudio-Setup-${{ env.VERSION }}-lite.exe
          fail_on_unmatched_files: true
